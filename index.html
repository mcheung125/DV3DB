<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Dex Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .element-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: white;
    }
    .bg-Fire { background-color: #ef4444; }
    .bg-Water { background-color: #3b82f6; }
    .bg-Wind { background-color: #10b981; }
    .bg-Steel { background-color: #6b7280; }
    .bg-Earth { background-color: #b45309; }
    .bg-Lightning { background-color: #f59e0b; }
    .bg-Light { background-color: #eab308; color: #1f2937; }
    .bg-Dark { background-color: #6d28d9; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

  <header class="bg-gray-800 border-b border-gray-700 py-6 px-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <h1 class="text-2xl font-black tracking-wider text-amber-400">🐉 DRAGON DEX</h1>
      
      <!-- Filters & Sorting -->
      <div class="flex flex-wrap gap-3 w-full md:w-auto">
        <input type="text" id="searchBar" placeholder="Search dragon name or ability..." class="bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 flex-grow md:w-64">
        
        <select id="rarityFilter" class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
          <option value="all">All Rarities</option>
          <option value="Rare">Rare</option>
          <option value="Epic">Epic</option>
          <option value="Legendary">Legendary</option>
        </select>

        <select id="elementFilter" class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
          <option value="all">All Elements</option>
          <option value="Fire">Fire</option>
          <option value="Water">Water</option>
          <option value="Wind">Wind</option>
          <option value="Steel">Steel</option>
          <option value="Earth">Earth</option>
          <option value="Lightning">Lightning</option>
          <option value="Light">Light</option>
          <option value="Dark">Dark</option>
        </select>

        <select id="sortFilter" class="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 font-semibold text-amber-400">
          <option value="none">Sort: Default</option>
          <option value="atk">Highest Attack</option>
          <option value="hp">Highest HP</option>
          <option value="def">Highest Defense</option>
          <option value="mag">Highest Magic</option>
          <option value="res">Highest Resistance</option>
          <option value="spd">Highest Speed</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-8">
    <div id="dragonGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Generated Cards go here -->
    </div>
  </main>

  <!-- Load the external data file -->
  <script src="dragons.js"></script>

  <script>
    const rarityColors = {
      Rare: "text-blue-400 border-blue-500",
      Epic: "text-purple-400 border-purple-500",
      Legendary: "text-amber-400 border-amber-500"
    };

    function renderDragons() {
      const grid = document.getElementById("dragonGrid");
      const searchTerm = document.getElementById("searchBar").value.toLowerCase();
      const rarityTerm = document.getElementById("rarityFilter").value;
      const elementTerm = document.getElementById("elementFilter").value;
      const sortTerm = document.getElementById("sortFilter").value;

      grid.innerHTML = "";

      if (typeof dragons === 'undefined') {
        grid.innerHTML = `<p class="text-red-400 font-bold">Error: dragons.js not found or not loaded properly.</p>`;
        return;
      }

      // 1. Filter the dataset
      let filtered = dragons.filter(d => {
        const matchesSearch = d.name.toLowerCase().includes(searchTerm) || d.ability.toLowerCase().includes(searchTerm);
        const matchesRarity = rarityTerm === "all" || d.rarity === rarityTerm;
        const matchesElement = elementTerm === "all" || d.elements.includes(elementTerm);
        return matchesSearch && matchesRarity && matchesElement;
      });

      // 2. Sort the dataset
      if (sortTerm !== "none") {
        filtered.sort((a, b) => b.stats[sortTerm] - a.stats[sortTerm]);
      }

      // 3. Render the dataset
      filtered.forEach(d => {
        const card = document.createElement("div");
        card.className = "bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg flex flex-col justify-between hover:border-amber-500 transition";
        
        const tagsHtml = d.elements.map(el => `<span class="element-tag bg-${el}">${el}</span>`).join(" ");
        
        // Highlight the sorted stat if one is selected
        const getStatClass = (stat) => sortTerm === stat ? "font-black text-amber-300 scale-110" : "font-bold text-gray-300";
        const getLabelClass = (stat) => sortTerm === stat ? "text-amber-400 font-bold" : "text-gray-500 font-medium";

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h2 class="text-xl font-bold text-white">${d.name}</h2>
              <span class="text-xs font-mono border px-2 py-0.5 rounded ${rarityColors[d.rarity] || 'text-white'}">${d.rarity.toUpperCase()}</span>
            </div>
            <div class="flex gap-1.5 mb-4">${tagsHtml}</div>
            
            <div class="bg-gray-900/50 rounded-lg p-3 grid grid-cols-3 gap-2 text-center text-xs border border-gray-700/50 mb-4 transition-all">
              <div><p class="${getLabelClass('hp')}">HP</p><p class="${sortTerm === 'hp' ? getStatClass('hp') : 'font-bold text-emerald-400'}">${d.stats.hp}</p></div>
              <div><p class="${getLabelClass('atk')}">ATK</p><p class="${sortTerm === 'atk' ? getStatClass('atk') : 'font-bold text-red-400'}">${d.stats.atk}</p></div>
              <div><p class="${getLabelClass('def')}">DEF</p><p class="${sortTerm === 'def' ? getStatClass('def') : 'font-bold text-blue-400'}">${d.stats.def}</p></div>
              <div><p class="${getLabelClass('mag')}">MAG</p><p class="${sortTerm === 'mag' ? getStatClass('mag') : 'font-bold text-fuchsia-400'}">${d.stats.mag}</p></div>
              <div><p class="${getLabelClass('res')}">RES</p><p class="${sortTerm === 'res' ? getStatClass('res') : 'font-bold text-slate-300'}">${d.stats.res}</p></div>
              <div><p class="${getLabelClass('spd')}">SPD</p><p class="${sortTerm === 'spd' ? getStatClass('spd') : 'font-bold text-cyan-400'}">${d.stats.spd}</p></div>
            </div>
          </div>
          
          <div class="border-t border-gray-700/60 pt-3 mt-auto">
            <p class="text-amber-400 text-xs font-bold uppercase tracking-wider">Unique Ability: ${d.ability}</p>
            <p class="text-gray-400 text-sm mt-0.5">${d.description}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Event Listeners
    document.getElementById("searchBar").addEventListener("input", renderDragons);
    document.getElementById("rarityFilter").addEventListener("change", renderDragons);
    document.getElementById("elementFilter").addEventListener("change", renderDragons);
    document.getElementById("sortFilter").addEventListener("change", renderDragons);

    // Initial render
    renderDragons();
  </script>
</body>
</html>
